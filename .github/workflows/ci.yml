name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  internal-links:
    name: Check internal Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ./scripts/check-links.sh

  external-links:
    name: Check external links (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true # SAP Community / vendor pages rate-limit and 403 bots; don't block merges on that
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --exclude-mail
            --accept 200,201,202,203,204,301,302,307,308,403,429
            './**/*.md'
          fail: false

  mermaid-validate:
    name: Validate Mermaid diagrams render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @mermaid-js/mermaid-cli
      - run: bash ./scripts/validate-mermaid.sh
